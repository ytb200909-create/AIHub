name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - "AIHub/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned, device)
        run: |
          xcodebuild \
            -project AIHub.xcodeproj \
            -scheme AIHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AIHub.app Payload/
          zip -qry AIHub-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-unsigned-ipa
          path: AIHub-unsigned.ipa
